# Container logs are kept small: without a limit the app's log once grew to 5.7 GB on a 40 GB disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build: .
    logging: *logging
    # Reachable only from the server itself: visitors come through Caddy (nordiva.com.ua), never straight to this port.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    restart: always
    environment:
      - TZ=Europe/Kiev
      # Catalog cache lives in the Redis container below, reachable only inside this network.
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 3g
    cpus: 1.5

  # Cache only: everything in it can be rebuilt from MongoDB, so nothing is written to disk.
  # No "ports" on purpose: Redis must not be reachable from the internet.
  redis:
    image: redis:7-alpine
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: always
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    logging: *logging
    # Only from the server itself too. Photos are served through Caddy (assets.nordiva.com.ua -> 9000).
    # The MinIO admin console (9001) is opened through an SSH tunnel: ssh -L 9001:127.0.0.1:9001 root@<server>, then http://localhost:9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # The MinIO sign-in is set in the server's .env.local (the app uploads with the same pair) and is
      # never written in this file. Compose reads it when started with: docker compose --env-file .env.local ...
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.local and start compose with --env-file .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.local and start compose with --env-file .env.local}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data: